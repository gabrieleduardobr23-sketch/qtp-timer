<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer QTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;800&display=swap">
<style>
/* Layout: palco em tela cheia que assume a cor da fase; barra de 5 minutos e controles embaixo. */
:root {
  --ink: #141414;
  --paper: #F7F5F0;
  --card: #FFFEFB;
  --muted: #4A4A55;
  --blue: #0B5CC4;
  --yellow: #F5B800;
  --green: #0B7A3E;
  --red: #D7261E;
  --slate: #3A3A40;
  --display: 'Archivo Black', 'Arial Black', Arial, sans-serif;
  --body: 'Archivo', Arial, sans-serif;
  --stage-bg: var(--paper);
  --stage-ink: var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); display: flex; flex-direction: column; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 14px clamp(16px, 3vw, 32px); border-bottom: 2px solid var(--ink); background: var(--paper); }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { font-family: var(--display); font-size: 30px; letter-spacing: -0.01em; }
.stripe { display: flex; width: 96px; height: 10px; border-radius: 5px; overflow: hidden; }
.stripe i { flex: 1; }


.opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; align-items: center; padding: 0 16px 18px; background: var(--paper); }
.opt { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; min-height: 32px; }
.opt input { width: 18px; height: 18px; accent-color: var(--ink); cursor: pointer; }
.link, .ghost { font: 600 15px var(--body); background: none; border: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 4px; min-height: 32px; }
.ghost { text-decoration: none; border: 2px solid var(--ink); border-radius: 999px; color: var(--ink); padding: 6px 16px; font-weight: 800; }

main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.stage { flex: 1; background: var(--stage-bg); color: var(--stage-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(6px, 1.6vh, 20px); padding: clamp(16px, 3vh, 40px) 16px; transition: background-color 400ms ease, color 400ms ease; min-height: 0; overflow: hidden; }
.phase-step { font-size: clamp(14px, 1.6vw, 20px); font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
.phase-name { font-family: var(--display); font-size: clamp(32px, min(7vw, 9vh), 104px); line-height: 1; margin: 0; text-wrap: balance; }
.clock { font-family: var(--display); font-size: clamp(72px, min(22vw, 26vh), 300px); line-height: 0.9; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tip { font-size: clamp(16px, min(2vw, 3vh), 26px); line-height: 1.3; max-width: 34ch; margin: 0; text-wrap: balance; opacity: 0.85; }
.stage.pulse .clock { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }

.track-wrap { padding: 18px clamp(16px, 3vw, 32px) 8px; background: var(--paper); border-top: 2px solid var(--ink); }
.track { display: flex; gap: 6px; }
.seg { position: relative; height: 34px; border-radius: 8px; background: #E4E1D9; overflow: hidden; }
.seg .fill { position: absolute; inset: 0 auto 0 0; width: 0%; }
.seg .lbl { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 12px; font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; color: var(--ink); }
.seg.on-dark .lbl { color: var(--paper); }
.ticks { display: flex; gap: 6px; margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks div { display: flex; justify-content: space-between; }

.controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 14px 16px 18px; background: var(--paper); }
.btn { font: 800 18px var(--body); min-height: 52px; padding: 0 22px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
.btn.primary { background: var(--ink); color: var(--paper); min-width: 180px; justify-content: center; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }


@media (max-width: 640px) {
  .seg .lbl { font-size: 12px; padding: 0 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .stage { transition: none; }
  .stage.pulse .clock { animation: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">QTP</span>
    <span class="stripe" aria-hidden="true"><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i><i style="background:var(--blue)"></i></span>
  </div>
  <button class="ghost" type="button" id="btn-full">Tela cheia</button>
</header>

<main>
  <section class="stage" id="stage" aria-live="polite">
    <div class="phase-step" id="step">Pronto para começar</div>
    <h1 class="phase-name" id="phase">Rodada de 5 minutos</h1>
    <div class="clock" id="clock" role="timer" aria-label="Tempo da fase">5:00</div>
    <p class="tip" id="tip">Aperte Iniciar quando o vendedor fizer a primeira ligação.</p>
  </section>

  <div class="track-wrap">
    <div class="track" id="track"></div>
    <div class="ticks" id="ticks"></div>
  </div>

  <div class="controls">
    <button class="btn primary" type="button" id="btn-start">Iniciar</button>
    <button class="btn" type="button" id="btn-skip">Próxima fase</button>
    <button class="btn" type="button" id="btn-reset">Reiniciar</button>
  </div>
  <div class="opts">
    <label class="opt" for="opt-sound"><input type="checkbox" id="opt-sound" checked> Som</label>
    <label class="opt" for="opt-warn"><input type="checkbox" id="opt-warn" checked> Aviso 10 s antes</label>
    <label class="opt" for="opt-prep"><input type="checkbox" id="opt-prep"> Preparação de 2 min</label>
    <button class="link" type="button" id="btn-test">Testar som</button>
  </div>
</main>

<script>
(function () {
  var PREP = { id: 'prep', name: 'Preparação', dur: 120, bg: '#3A3A40', ink: '#F7F5F0', dark: true,
    tip: 'A equipe combina a abordagem e quais gatilhos vai usar.' };
  var BASE = [
    { id: 'gelo', name: 'Quebra-gelo', dur: 60, bg: '#0B5CC4', ink: '#F7F5F0', dark: true,
      tip: 'Crie conexão e cite quem indicou. Ganhe o direito de perguntar.' },
    { id: 'qtp', name: 'Identificar o QTP', dur: 120, bg: '#F5B800', ink: '#141414', dark: false,
      tip: 'Descubra o que ele quer, o que já tem e quanto pode pagar por mês.' },
    { id: 'fecha', name: 'Fechamento', dur: 120, bg: '#0B7A3E', ink: '#F7F5F0', dark: true,
      tip: 'Proposta que caiba no QTP, agendamento ou venda, e pedido de indicação.' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), stepEl = $('step'), phaseEl = $('phase'), clockEl = $('clock'), tipEl = $('tip'),
      track = $('track'), ticks = $('ticks'),
      btnStart = $('btn-start'), btnSkip = $('btn-skip'), btnReset = $('btn-reset'), btnTest = $('btn-test'), btnFull = $('btn-full'),
      optSound = $('opt-sound'), optWarn = $('opt-warn'), optPrep = $('opt-prep');

  var phases = [], starts = [], total = 0;
  var running = false, finished = false, elapsed = 0, anchor = 0, lastFired = -1, timerId = null, wakeLock = null;

  function build() {
    phases = optPrep.checked ? [PREP].concat(BASE) : BASE.slice();
    starts = []; total = 0;
    phases.forEach(function (p) { starts.push(total); total += p.dur; });
    track.innerHTML = ''; ticks.innerHTML = '';
    phases.forEach(function (p, i) {
      var seg = document.createElement('div');
      seg.className = 'seg' + (p.dark ? ' on-dark-fill' : '');
      seg.style.flex = p.dur;
      seg.innerHTML = '<div class="fill" style="background:' + p.bg + '"></div><div class="lbl">' + p.name + '</div>';
      track.appendChild(seg);
      var t = document.createElement('div');
      t.style.flex = p.dur;
      t.innerHTML = '<span>' + fmt(starts[i]) + '</span>' + (i === phases.length - 1 ? '<span>' + fmt(total) + '</span>' : '');
      ticks.appendChild(t);
    });
  }

  function fmt(s) {
    s = Math.max(0, Math.ceil(s - 1e-6));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function phaseAt(t) {
    for (var i = phases.length - 1; i >= 0; i--) if (t >= starts[i]) return i;
    return 0;
  }

  // ---------- som ----------
  var ctx = null;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  function tone(freq, start, dur, vol, type) {
    var c = audio(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    var t0 = c.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  var SOUNDS = {
    phase: function () { tone(660, 0, 0.35, 0.35); tone(880, 0.18, 0.5, 0.35); },
    warn: function () { tone(988, 0, 0.18, 0.25, 'triangle'); tone(988, 0.3, 0.18, 0.25, 'triangle'); },
    tick: function () { tone(1200, 0, 0.12, 0.2, 'square'); },
    end: function () { [0, 0.45, 0.9].forEach(function (d) { tone(440, d, 0.4, 0.45, 'sawtooth'); tone(330, d, 0.4, 0.3, 'sawtooth'); }); }
  };
  function play(name) { if (optSound.checked && SOUNDS[name]) SOUNDS[name](); }

  // ---------- eventos sonoros na linha do tempo ----------
  function events() {
    var ev = [];
    phases.forEach(function (p, i) {
      if (i > 0) ev.push({ t: starts[i], kind: 'phase', i: i });
      if (i < phases.length - 1 && p.dur > 15) ev.push({ t: starts[i] + p.dur - 10, kind: 'warn' });
    });
    [3, 2, 1].forEach(function (k) { ev.push({ t: total - k, kind: 'tick' }); });
    ev.push({ t: total, kind: 'end' });
    return ev.sort(function (a, b) { return a.t - b.t; });
  }

  function fire(from, to) {
    events().forEach(function (e) {
      if (e.t > from && e.t <= to) {
        if (e.kind === 'phase') play('phase');
        else if (e.kind === 'warn') { if (optWarn.checked) play('warn'); }
        else if (e.kind === 'tick') play('tick');
        else if (e.kind === 'end') play('end');
      }
    });
  }

  // ---------- relógio ----------
  function now() { return performance.now() / 1000; }
  function current() { return running ? elapsed + (now() - anchor) : elapsed; }

  function loop() {
    var t = Math.min(current(), total);
    if (t > lastFired) { fire(lastFired, t); lastFired = t; }
    if (t >= total) { finish(); return; }
    render(t);
  }

  function start() {
    audio();
    if (finished) reset();
    if (!running) {
      if (elapsed === 0 && lastFired < 0) { play('phase'); lastFired = 0; }
      running = true; anchor = now();
      timerId = setInterval(loop, 100);
      keepAwake();
    }
    render(current());
  }
  function pause() {
    if (!running) return;
    elapsed = current(); running = false; clearInterval(timerId); timerId = null;
    render(elapsed);
  }
  function reset() {
    running = false; finished = false; clearInterval(timerId); timerId = null;
    elapsed = 0; lastFired = -1;
    releaseAwake();
    render(0);
  }
  function skip() {
    if (finished) return;
    audio();
    var t = current(), i = phaseAt(t);
    if (i >= phases.length - 1) return;
    var target = starts[i + 1];
    if (lastFired < 0) lastFired = 0;
    // pula os avisos intermediários e toca só a virada da fase
    lastFired = target - 0.001;
    elapsed = target; anchor = now();
    fire(lastFired, target); lastFired = target;
    render(target);
  }
  function finish() {
    running = false; finished = true; clearInterval(timerId); timerId = null;
    elapsed = total; releaseAwake();
    render(total);
  }

  function render(t) {
    var idle = !running && t === 0 && !finished;
    var i = phaseAt(Math.min(t, total - 0.001)), p = phases[i];
    var segs = track.children;
    for (var k = 0; k < segs.length; k++) {
      var f = segs[k].querySelector('.fill');
      var frac = Math.max(0, Math.min(1, (t - starts[k]) / phases[k].dur));
      f.style.width = (frac * 100) + '%';
      segs[k].classList.toggle('on-dark', phases[k].dark && frac > 0.5);
    }
    if (finished) {
      setStage('#D7261E', '#F7F5F0');
      stepEl.textContent = 'Rodada encerrada';
      phaseEl.textContent = 'Tempo esgotado';
      clockEl.textContent = '0:00';
      tipEl.textContent = 'Cliente revela as cartas secretas e os jurados pontuam.';
      stage.classList.remove('pulse');
      btnStart.firstChild.nodeValue = 'Nova rodada ';
      btnSkip.disabled = true;
      return;
    }
    if (idle) {
      setStage('#F7F5F0', '#141414');
      stepEl.textContent = 'Pronto para começar';
      phaseEl.textContent = 'Rodada de ' + fmt(total).replace(':00', '') + ' minutos';
      clockEl.textContent = fmt(total);
      tipEl.textContent = 'Aperte Iniciar quando o vendedor fizer a primeira ligação.';
      stage.classList.remove('pulse');
      btnStart.firstChild.nodeValue = 'Iniciar ';
      btnSkip.disabled = true;
      return;
    }
    setStage(p.bg, p.ink);
    var left = starts[i] + p.dur - t;
    stepEl.textContent = fmt(starts[i]) + ' a ' + fmt(starts[i] + p.dur) + (running ? '' : ' · Pausado');
    phaseEl.textContent = p.name;
    clockEl.textContent = fmt(left);
    tipEl.textContent = p.tip;
    stage.classList.toggle('pulse', running && left <= 10);
    btnStart.firstChild.nodeValue = running ? 'Pausar ' : 'Continuar ';
    btnSkip.disabled = i >= phases.length - 1;
  }
  function setStage(bg, ink) { stage.style.setProperty('--stage-bg', bg); stage.style.setProperty('--stage-ink', ink); }

  // ---------- tela ligada e tela cheia ----------
  function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {}); } catch (e) {}
  }
  function releaseAwake() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {} }
  function fullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else (document.documentElement.requestFullscreen || function () { return Promise.reject(); }).call(document.documentElement).catch(function () {
        btnFull.textContent = 'Tela cheia indisponível aqui';
      });
    } catch (e) { btnFull.textContent = 'Tela cheia indisponível aqui'; }
  }

  // ---------- ligações ----------
  btnStart.addEventListener('click', function () { running ? pause() : start(); });
  btnSkip.addEventListener('click', skip);
  btnReset.addEventListener('click', reset);
  btnFull.addEventListener('click', fullscreen);
  btnTest.addEventListener('click', function () {
    audio(); var was = optSound.checked; optSound.checked = true; play('phase'); optSound.checked = was;
  });
  optPrep.addEventListener('change', function () { reset(); build(); render(0); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'n' || e.key === 'N') skip();
    else if (e.key === 'f' || e.key === 'F') fullscreen();
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && running) { keepAwake(); loop(); } });

  build(); render(0);
})();
</script>
</body>
</html>
